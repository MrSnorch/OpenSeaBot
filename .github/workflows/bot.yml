name: bot

on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"   # страховка: если цепочка запусков оборвалась, раз в час поднимет бота снова

# Только один запуск за раз; следующий ждёт в очереди, пока текущий не закончится
concurrency:
  group: bot
  cancel-in-progress: false

permissions:
  actions: write    # чтобы запустить следующий запуск
  contents: write   # чтобы сохранять state.db в ветку `state`

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355   # лимит GitHub на джобу — 360 минут
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - run: pip install -r requirements-ci.txt

      - name: Restore state.db
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/state.sh pull

      - name: Queue the next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bot.yml --ref "${{ github.ref_name }}"

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENSEA_API_KEY: ${{ secrets.OPENSEA_API_KEY }}
          COLLECTIONS: ${{ vars.COLLECTIONS }}
          RATE_LIMIT_PER_MIN: "105"
          PYTHONUNBUFFERED: "1"
          GH_TOKEN: ${{ github.token }}
        run: |
          # раз в час сохраняем state.db в ветку, чтобы авария раннера стоила максимум часа данных
          ( while true; do sleep 3600; bash scripts/state.sh push || true; done ) &
          SYNC=$!
          # SIGINT = аккуратная остановка бота
          timeout --signal=SIGINT --kill-after=30 345m python bot.py || true
          kill "$SYNC" 2>/dev/null || true

      - name: Save state.db
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/state.sh push
